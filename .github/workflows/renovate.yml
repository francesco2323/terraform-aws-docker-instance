name: Renovate Config Validation

"on":
  pull_request:
    paths:
      - renovate.json
  push:
    branches:
      - main
    paths:
      - renovate.json

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Renovate config
        run: npx --yes --package renovate renovate-config-validator
