name: PR Review Report

"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  workflow_run:
    workflows:
      - Validate
      - Docs
      - Security
      - Test
      - SAST
      - DAST
      - Conventional Commits
      - Renovate Config Validation
    types:
      - completed

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Build and publish PR review report
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-review-total-report -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let prNumber;
            let headSha;

            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
              headSha = context.payload.pull_request.head.sha;
            } else if (context.eventName === 'workflow_run') {
              const prs = context.payload.workflow_run.pull_requests || [];
              if (!prs.length) {
                core.info('No pull request associated with this workflow_run.');
                return;
              }
              prNumber = prs[0].number;
              headSha = context.payload.workflow_run.head_sha;
            } else {
              core.info(`Unsupported trigger: ${context.eventName}`);
              return;
            }

            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref: headSha,
              per_page: 100,
            }).then((pages) => pages.flatMap((page) => page.check_runs || []));

            const relevantChecks = checkRuns
              .filter((check) => check.app && check.app.slug === 'github-actions')
              .filter((check) => !check.name.includes('PR Review Report'))
              .sort((a, b) => a.name.localeCompare(b.name));

            const counts = {
              success: 0,
              failure: 0,
              cancelled: 0,
              skipped: 0,
              neutral: 0,
              timed_out: 0,
              action_required: 0,
              stale: 0,
              startup_failure: 0,
              in_progress: 0,
              queued: 0,
              unknown: 0,
            };

            for (const check of relevantChecks) {
              const key = check.status === 'completed' ? (check.conclusion || 'unknown') : check.status;
              if (Object.prototype.hasOwnProperty.call(counts, key)) {
                counts[key] += 1;
              } else {
                counts.unknown += 1;
              }
            }

            const total = relevantChecks.length;
            const completed = total - counts.in_progress - counts.queued;
            const passRate = completed > 0 ? ((counts.success / completed) * 100).toFixed(1) : '0.0';

            const header = [
              '## Pull Request Tooling Report',
              '',
              `- Commit: ${headSha}`,
              `- Total checks: ${total}`,
              `- Completed checks: ${completed}`,
              `- Success: ${counts.success}`,
              `- Failure: ${counts.failure}`,
              `- Cancelled: ${counts.cancelled}`,
              `- Skipped: ${counts.skipped}`,
              `- In progress: ${counts.in_progress}`,
              `- Queued: ${counts.queued}`,
              `- Pass rate (completed): ${passRate}%`,
              ''
            ];

            const totalsByConclusion = [
              '### Totals by conclusion',
              '',
              '| Conclusion | Count |',
              '| --- | ---: |',
              `| success | ${counts.success} |`,
              `| failure | ${counts.failure} |`,
              `| cancelled | ${counts.cancelled} |`,
              `| skipped | ${counts.skipped} |`,
              `| neutral | ${counts.neutral} |`,
              `| timed_out | ${counts.timed_out} |`,
              `| action_required | ${counts.action_required} |`,
              `| stale | ${counts.stale} |`,
              `| startup_failure | ${counts.startup_failure} |`,
              `| in_progress | ${counts.in_progress} |`,
              `| queued | ${counts.queued} |`,
              `| unknown | ${counts.unknown} |`,
              ''
            ];

            const details = [
              '### Per-check details',
              '',
              '| Tool/Check | Status | Conclusion | Details |',
              '| --- | --- | --- | --- |',
            ];

            if (!relevantChecks.length) {
              details.push('| _No checks found yet_ | - | - | - |');
            } else {
              for (const check of relevantChecks) {
                const status = check.status || 'unknown';
                const conclusion = check.conclusion || 'pending';
                const link = check.details_url ? `[view run](${check.details_url})` : 'n/a';
                const name = (check.name || 'unnamed').replace(/\|/g, '\\|');
                details.push(`| ${name} | ${status} | ${conclusion} | ${link} |`);
              }
            }

            const body = [marker, ...header, ...totalsByConclusion, ...details].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated report comment for PR #${prNumber}`);
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
              core.info(`Created report comment for PR #${prNumber}`);
            }
