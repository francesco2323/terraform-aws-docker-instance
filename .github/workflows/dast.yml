name: DAST

"on":
  workflow_dispatch:
    inputs:
      target_url:
        description: "Public URL to scan with OWASP ZAP baseline"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ inputs.target_url }}
          allow_issue_writing: false
          fail_action: false
